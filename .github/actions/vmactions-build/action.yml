name: VM actions build
description: Build and test Sagittarius inside FreeBSD/OpenBSD VM actions

inputs:
  vm-name:
    description: VM OS name used by vmactions
    required: true
  arch:
    description: VM architecture
    required: true
  setup-script:
    description: Setup script path inside repository
    required: true
  cc:
    description: Setup compiler environment variable script
    required: false

runs:
  using: composite
  steps:
    - name: Setup VM
      uses: jenseng/dynamic-uses@v1
      with:
        uses: vmactions/${{ inputs.vm-name }}-vm@v1
        with: |
          {
            "arch": ${{ toJSON(inputs.arch) }},
            "sync": "nfs"
          }

    - name: Install dependencies / current
      uses: ktakashi/dynamic-shell@v1
      with:
        shell: "${{ inputs.vm-name }} {0}"
        run: |
          cd $GITHUB_WORKSPACE;
          sh "./${{ inputs.setup-script }}"
          bash "./.ci/build-current.sh"

    - name: Pre-build
      uses: ktakashi/dynamic-shell@v1
      with:
        shell: "${{ inputs.vm-name }} {0}"
        run: |
          cd $GITHUB_WORKSPACE;
          ./dist.sh gen
          setup_cc=${{ inputs.cc }}
          if [ "$setup_cc" != "" ]; then
            . "./$setup_cc"
          fi
          cmake .

    - name: Build
      uses: ktakashi/dynamic-shell@v1
      with:
        shell: "${{ inputs.vm-name }} {0}"
        run: |
          cd $GITHUB_WORKSPACE;
          make

    - name: Test
      uses: ktakashi/dynamic-shell@v1
      with:
        shell: "${{ inputs.vm-name }} {0}"
        run: |
          cd $GITHUB_WORKSPACE;
          ctest --output-on-failure -j2
