name: POSIX build
description: Build and test Sagittarius on Linux or macOS runners

inputs:
  setup-script:
    description: Setup script path inside repository
    required: true

runs:
  using: composite
  steps:
    - name: Install dependencies
      run: |
        bash "${{ inputs.setup-script }}" "sudo"
        mkdir current_sagittarius
      shell: bash

    - name: Install current sagittarius
      working-directory: current_sagittarius
      run: |
        bash ../.ci/build-current.sh 'yes'
      shell: bash

    - name: Pre-build
      run: |
        ./dist.sh gen
        cmake . -DBUILD_TYPE=Debug
      shell: bash

    - name: Build
      run: make
      shell: bash

    - name: Test
      run: ctest --output-on-failure -j8
      shell: bash
