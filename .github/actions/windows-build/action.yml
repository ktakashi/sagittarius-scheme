name: Windows build
description: Build and test Sagittarius on Windows runners

inputs:
  arch:
    description: MSVC target architecture
    required: true

runs:
  using: composite
  steps:
    - name: Install current sagittarius
      run: .\.ci\install-current.ps1
      shell: powershell

    - name: Setup MSVC
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: ${{ inputs.arch }}

    - name: Pre build
      run: dist.bat gen
      shell: cmd

    - name: CMake
      run: cmake . -G "Ninja" -DSKIP_TEST_VECTOR=ON -DDEBUG_GENSTUB=ON
      shell: cmd

    - name: Build
      run: ninja -j8
      shell: cmd

    - name: Test
      # Can't use multi process because of the SChannel issue.
      # It causes some race condition.
      run: ctest --output-on-failure -LE json
      shell: cmd
