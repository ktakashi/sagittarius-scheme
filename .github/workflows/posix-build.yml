name: POSIX Build 
on: workflow_call

jobs:
  POSIX-Build:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.name }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: 'Linux', os: 'ubuntu-latest', setup: '.ci/setup-ubuntu.sh' }
          - { name: 'macOS', os: 'macos-latest',  setup: '.ci/setup-macos.sh' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        uses: ./.github/actions/posix-build
        with:
          setup-script: ${{ matrix.config.setup }}
